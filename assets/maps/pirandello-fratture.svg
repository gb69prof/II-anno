<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Le fratture di Pirandello</title><desc id="desc">Crisi culturale, società moderna e fratture del 1903 mettono in crisi l’io unitario e conducono alla nuova immagine dell’uomo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#a85b43"/></marker><style>text{font-family:Arial,sans-serif;fill:#18302f}.h{font-size:27px;font-weight:700}.s{font-size:18px}.c{fill:#7d4035;stroke:#542a24;stroke-width:3}.c text{fill:white}.n{fill:#fff9ee;stroke:#a85b43;stroke-width:2}.l{stroke:#a85b43;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="28" fill="#efe8dc"/>
<g class="l"><path d="M220 165L480 285"/><path d="M600 165L600 270"/><path d="M980 165L720 285"/><path d="M600 410L600 520"/></g>
<rect class="n" x="55" y="70" width="330" height="110" rx="22"/><text class="h" x="220" y="116" text-anchor="middle">Crisi dell’io</text><text class="s" x="220" y="150" text-anchor="middle">mette in dubbio la coscienza</text><rect class="n" x="435" y="70" width="330" height="110" rx="22"/><text class="h" x="600" y="116" text-anchor="middle">Società moderna</text><text class="s" x="600" y="150" text-anchor="middle">moltiplica ruoli e sguardi</text><rect class="n" x="815" y="70" width="330" height="110" rx="22"/><text class="h" x="980" y="116" text-anchor="middle">1903</text><text class="s" x="980" y="150" text-anchor="middle">incrina famiglia e sicurezza</text>
<g class="c"><rect x="390" y="270" width="420" height="145" rx="30"/><text class="h" x="600" y="328" text-anchor="middle">LE FORME NON BASTANO</text><text class="s" x="600" y="365" text-anchor="middle">la vita non coincide più con l’ordine</text></g><rect class="n" x="390" y="520" width="420" height="105" rx="22"/><text class="h" x="600" y="563" text-anchor="middle">Nuova immagine dell’uomo</text><text class="s" x="600" y="595" text-anchor="middle">nasce dalla frattura</text></svg>
