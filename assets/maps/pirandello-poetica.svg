<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">La poetica di Pirandello</title><desc id="desc">Il contrasto produce l’avvertimento del contrario; la riflessione produce il sentimento del contrario; tecniche narrative e metateatro trasformano la frattura in forma.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#a85b43"/></marker><style>text{font-family:Arial,sans-serif;fill:#18302f}.h{font-size:25px;font-weight:700}.s{font-size:17px}.n{fill:#fffaf0;stroke:#a85b43;stroke-width:2}.c{fill:#7d4035;stroke:#522a24;stroke-width:3}.c text{fill:white}.l{stroke:#a85b43;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="28" fill="#efe8dc"/><g class="l"><path d="M250 170L470 285"/><path d="M950 170L730 285"/><path d="M520 430L300 535"/><path d="M680 430L900 535"/></g><rect class="n" x="65" y="70" width="370" height="115" rx="22"/><text class="h" x="250" y="116" text-anchor="middle">Avvertimento</text><text class="s" x="250" y="150" text-anchor="middle">fa percepire subito il contrario</text><rect class="n" x="765" y="70" width="370" height="115" rx="22"/><text class="h" x="950" y="116" text-anchor="middle">Riflessione</text><text class="s" x="950" y="150" text-anchor="middle">scopre ragioni e dolore</text><g class="c"><rect x="385" y="260" width="430" height="180" rx="32"/><text class="h" x="600" y="328" text-anchor="middle">SENTIMENTO</text><text class="h" x="600" y="365" text-anchor="middle">DEL CONTRARIO</text><text class="s" x="600" y="405" text-anchor="middle">tiene insieme riso e dolore</text></g><rect class="n" x="80" y="520" width="390" height="110" rx="22"/><text class="h" x="275" y="565" text-anchor="middle">Tecniche narrative</text><text class="s" x="275" y="598" text-anchor="middle">moltiplicano le prospettive</text><rect class="n" x="730" y="520" width="390" height="110" rx="22"/><text class="h" x="925" y="565" text-anchor="middle">Metateatro</text><text class="s" x="925" y="598" text-anchor="middle">spezza la rappresentazione</text></svg>
