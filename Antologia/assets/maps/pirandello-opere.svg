<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Le opere di Pirandello</title><desc id="desc">Mattia cambia nome, Moscarda distrugge immagini, Belluca evade, Ponza e Frola dividono la verità, i Sei personaggi spezzano il teatro ed Enrico IV resta nella maschera.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#6e5543"/></marker><style>text{font-family:Arial,sans-serif;fill:#18302f}.h{font-size:22px;font-weight:700}.s{font-size:16px}.n{fill:#fff;stroke:#8d674c;stroke-width:2}.c{fill:#2d4947}.c text{fill:white}.l{stroke:#8d674c;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="28" fill="#efe8dc"/><g class="l"><path d="M480 285L310 170"/><path d="M600 255L600 170"/><path d="M720 285L890 170"/><path d="M480 395L310 510"/><path d="M600 425L600 510"/><path d="M720 395L890 510"/></g><g class="c"><rect x="420" y="255" width="360" height="175" rx="32"/><text class="h" x="600" y="325" text-anchor="middle">OPERE COME</text><text class="h" x="600" y="358" text-anchor="middle">ESPERIMENTI</text><text class="s" x="600" y="394" text-anchor="middle">vita e forma entrano in conflitto</text></g><g><rect class="n" x="70" y="70" width="330" height="115" rx="22"/><text class="h" x="235" y="115" text-anchor="middle">Mattia Pascal</text><text class="s" x="235" y="150" text-anchor="middle">cambia nome e perde i diritti</text><rect class="n" x="435" y="50" width="330" height="115" rx="22"/><text class="h" x="600" y="95" text-anchor="middle">Moscarda</text><text class="s" x="600" y="130" text-anchor="middle">distrugge le immagini di sé</text><rect class="n" x="800" y="70" width="330" height="115" rx="22"/><text class="h" x="965" y="115" text-anchor="middle">Belluca</text><text class="s" x="965" y="150" text-anchor="middle">evade con l’immaginazione</text><rect class="n" x="70" y="500" width="330" height="115" rx="22"/><text class="h" x="235" y="545" text-anchor="middle">Ponza e Frola</text><text class="s" x="235" y="580" text-anchor="middle">dividono la verità</text><rect class="n" x="435" y="520" width="330" height="115" rx="22"/><text class="h" x="600" y="565" text-anchor="middle">Sei personaggi</text><text class="s" x="600" y="600" text-anchor="middle">spezzano il teatro</text><rect class="n" x="800" y="500" width="330" height="115" rx="22"/><text class="h" x="965" y="545" text-anchor="middle">Enrico IV</text><text class="s" x="965" y="580" text-anchor="middle">resta nella maschera</text></g></svg>
