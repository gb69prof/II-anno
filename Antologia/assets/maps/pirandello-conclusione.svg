<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Conclusione del percorso su Pirandello</title><desc id="desc">Mondo stabile, fratture, vita e forma, umorismo e opere confluiscono nella responsabilità di riconoscere il limite delle maschere.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#956146"/></marker><style>text{font-family:Arial,sans-serif;fill:#18302f}.h{font-size:23px;font-weight:700}.s{font-size:16px}.n{fill:#fff9ee;stroke:#956146;stroke-width:2}.c{fill:#7d4035}.c text{fill:white}.l{stroke:#956146;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="28" fill="#efe8dc"/><g class="l"><path d="M170 205L330 305"/><path d="M385 150L455 270"/><path d="M600 140L600 250"/><path d="M815 150L745 270"/><path d="M1030 205L870 305"/><path d="M600 440L600 535"/></g><rect class="n" x="40" y="105" width="260" height="105" rx="22"/><text class="h" x="170" y="148" text-anchor="middle">Mondo stabile</text><text class="s" x="170" y="180" text-anchor="middle">prepara il limite</text><rect class="n" x="260" y="50" width="250" height="105" rx="22"/><text class="h" x="385" y="93" text-anchor="middle">Fratture</text><text class="s" x="385" y="125" text-anchor="middle">incrinano l’io</text><rect class="n" x="475" y="35" width="250" height="105" rx="22"/><text class="h" x="600" y="78" text-anchor="middle">Vita e forma</text><text class="s" x="600" y="110" text-anchor="middle">ridefiniscono l’uomo</text><rect class="n" x="690" y="50" width="250" height="105" rx="22"/><text class="h" x="815" y="93" text-anchor="middle">Umorismo</text><text class="s" x="815" y="125" text-anchor="middle">trasforma lo sguardo</text><rect class="n" x="900" y="105" width="260" height="105" rx="22"/><text class="h" x="1030" y="148" text-anchor="middle">Opere</text><text class="s" x="1030" y="180" text-anchor="middle">mettono alla prova</text><g class="c"><rect x="300" y="250" width="600" height="195" rx="34"/><text class="h" x="600" y="315" text-anchor="middle">NESSUNA IMMAGINE È</text><text class="h" x="600" y="350" text-anchor="middle">L’INTERA PERSONA</text><text class="s" x="600" y="395" text-anchor="middle">ma ogni immagine produce conseguenze reali</text></g><rect class="n" x="355" y="535" width="490" height="105" rx="22"/><text class="h" x="600" y="578" text-anchor="middle">Responsabilità interpretativa</text><text class="s" x="600" y="610" text-anchor="middle">distingue dati, prospettive e giudizi</text></svg>
