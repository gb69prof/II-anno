<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dalla strada allo splendore</title>
  <desc id="desc">Il gesto privato esposto nello spazio pubblico produce lo sguardo dei passanti e il giudizio. L'amore si sottrae a quel potere, apre un altrove e conduce allo splendore. Verso libero, ripetizione, contrasto, accumulazione e immagini rendono percepibile il passaggio.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#9d5663"/></marker>
    <style>
      .bg{fill:#f5efe4}.node{fill:#fffaf3;stroke:#b9a895;stroke-width:2}.accent{fill:#263a38;stroke:#263a38}.final{fill:#b54f62;stroke:#b54f62}.t{font:700 25px Georgia,serif;fill:#223330}.s{font:500 18px Arial,sans-serif;fill:#5b6662}.light{fill:#fff}.rel{font:700 15px Arial,sans-serif;fill:#9d5663;letter-spacing:.04em}.line{fill:none;stroke:#9d5663;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="36"/>
  <text x="600" y="62" text-anchor="middle" class="t" style="font-size:34px">I ragazzi che si amano</text>
  <text x="600" y="94" text-anchor="middle" class="s">dalla strada a uno spazio che lo sguardo non possiede</text>
  <rect class="node" x="45" y="165" width="205" height="110" rx="24"/><text x="147" y="207" text-anchor="middle" class="t">Gesto privato</text><text x="147" y="239" text-anchor="middle" class="s">un bacio nella strada</text>
  <rect class="node" x="300" y="165" width="205" height="110" rx="24"/><text x="402" y="207" text-anchor="middle" class="t">Esposizione</text><text x="402" y="239" text-anchor="middle" class="s">i passanti guardano</text>
  <rect class="node" x="555" y="165" width="205" height="110" rx="24"/><text x="657" y="207" text-anchor="middle" class="t">Giudizio</text><text x="657" y="239" text-anchor="middle" class="s">indica e classifica</text>
  <rect class="accent" x="810" y="165" width="205" height="110" rx="24"/><text x="912" y="207" text-anchor="middle" class="t light">Sottrazione</text><text x="912" y="239" text-anchor="middle" class="s light">l’amore non si lascia</text><text x="912" y="261" text-anchor="middle" class="s light">possedere</text>
  <path class="line" d="M250 220H292"/><text x="271" y="204" text-anchor="middle" class="rel">diventa</text>
  <path class="line" d="M505 220H547"/><text x="526" y="204" text-anchor="middle" class="rel">produce</text>
  <path class="line" d="M760 220H802"/><text x="781" y="204" text-anchor="middle" class="rel">non domina</text>
  <rect class="node" x="290" y="365" width="250" height="118" rx="28"/><text x="415" y="409" text-anchor="middle" class="t">Altrove interiore</text><text x="415" y="442" text-anchor="middle" class="s">nasce dentro la strada</text>
  <rect class="final" x="660" y="365" width="250" height="118" rx="28"/><text x="785" y="409" text-anchor="middle" class="t light">Splendore</text><text x="785" y="442" text-anchor="middle" class="s light">il primo amore trasforma</text><text x="785" y="464" text-anchor="middle" class="s light">la percezione del mondo</text>
  <path class="line" d="M912 275C910 335 540 326 500 357"/><text x="713" y="326" text-anchor="middle" class="rel">apre</text>
  <path class="line" d="M540 424H652"/><text x="596" y="407" text-anchor="middle" class="rel">conduce a</text>
  <rect class="node" x="125" y="570" width="950" height="100" rx="26"/>
  <text x="600" y="608" text-anchor="middle" class="t">La forma fa vivere il passaggio</text>
  <text x="600" y="643" text-anchor="middle" class="s">verso libero · ripetizione · contrasto · accumulazione · immagini</text>
  <path class="line" d="M600 570V500"/><text x="618" y="541" class="rel">rende percepibile</text>
</svg>
