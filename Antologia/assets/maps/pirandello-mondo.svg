<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Il mondo precedente di Pirandello</title><desc id="desc">La società borghese e il Positivismo producono ruoli, identità e fiducia nella conoscenza; la vita eccede le definizioni e prepara la frattura.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#9b6841"/></marker><style>text{font-family:Arial,sans-serif;fill:#18302f}.h{font-size:28px;font-weight:700}.s{font-size:18px}.c{fill:#f8f2e7;stroke:#7d4035;stroke-width:3}.n{fill:#fff;stroke:#9b6841;stroke-width:2}.l{stroke:#9b6841;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1200" height="680" rx="28" fill="#efe8dc"/><rect class="c" x="405" y="250" width="390" height="150" rx="30"/><text class="h" x="600" y="312" text-anchor="middle">MONDO PRECEDENTE</text><text class="s" x="600" y="348" text-anchor="middle">identità e realtà sembrano stabili</text>
<g class="l"><path d="M405 290L288 175"/><path d="M795 290L910 175"/><path d="M405 360L270 490"/><path d="M795 360L930 490"/></g>
<g><rect class="n" x="70" y="80" width="270" height="110" rx="22"/><text class="h" x="205" y="125" text-anchor="middle">Società borghese</text><text class="s" x="205" y="158" text-anchor="middle">assegna ruoli riconoscibili</text><rect class="n" x="860" y="80" width="270" height="110" rx="22"/><text class="h" x="995" y="125" text-anchor="middle">Positivismo</text><text class="s" x="995" y="158" text-anchor="middle">rafforza la fiducia nel sapere</text><rect class="n" x="50" y="485" width="300" height="110" rx="22"/><text class="h" x="200" y="530" text-anchor="middle">Forma sociale</text><text class="s" x="200" y="563" text-anchor="middle">rende possibile il riconoscimento</text><rect class="n" x="850" y="485" width="300" height="110" rx="22"/><text class="h" x="1000" y="530" text-anchor="middle">Vita mutevole</text><text class="s" x="1000" y="563" text-anchor="middle">eccede le definizioni</text></g>
</svg>
