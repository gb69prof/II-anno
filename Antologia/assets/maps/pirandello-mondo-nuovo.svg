<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">La nuova immagine del mondo</title><desc id="desc">La vita entra nelle forme, diventa uno e centomila, scopre le maschere e giunge alla crisi dell’io e alla verità prospettica.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#8d674c"/></marker><style>text{font-family:Arial,sans-serif;fill:#18302f}.h{font-size:26px;font-weight:700}.s{font-size:17px}.n{fill:#fff;stroke:#8d674c;stroke-width:2}.c{fill:#2d4947;stroke:#18302f;stroke-width:3}.c text{fill:white}.l{stroke:#8d674c;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="28" fill="#efe8dc"/><g class="l"><path d="M210 345L395 345"/><path d="M805 345L990 345"/><path d="M600 230L600 160"/><path d="M500 455L350 555"/><path d="M700 455L850 555"/></g><rect class="n" x="60" y="285" width="300" height="120" rx="24"/><text class="h" x="210" y="332" text-anchor="middle">VITA</text><text class="s" x="210" y="368" text-anchor="middle">muta e supera i confini</text><g class="c"><rect x="395" y="230" width="410" height="230" rx="34"/><text class="h" x="600" y="300" text-anchor="middle">UNO · CENTOMILA</text><text class="h" x="600" y="338" text-anchor="middle">NESSUNO</text><text class="s" x="600" y="385" text-anchor="middle">l’io si moltiplica negli sguardi</text></g><rect class="n" x="840" y="285" width="300" height="120" rx="24"/><text class="h" x="990" y="332" text-anchor="middle">FORMA</text><text class="s" x="990" y="368" text-anchor="middle">rende riconoscibile e fissa</text><rect class="n" x="450" y="45" width="300" height="105" rx="22"/><text class="h" x="600" y="88" text-anchor="middle">Maschere</text><text class="s" x="600" y="120" text-anchor="middle">producono identità sociali</text><rect class="n" x="120" y="535" width="330" height="105" rx="22"/><text class="h" x="285" y="578" text-anchor="middle">Crisi dell’io</text><text class="s" x="285" y="610" text-anchor="middle">nessuna forma contiene tutto</text><rect class="n" x="750" y="535" width="330" height="105" rx="22"/><text class="h" x="915" y="578" text-anchor="middle">Verità prospettica</text><text class="s" x="915" y="610" text-anchor="middle">ogni sguardo resta situato</text></svg>
