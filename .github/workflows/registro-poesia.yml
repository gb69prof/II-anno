name: Collaudo del registro Poesia
on:
  push:
    branches: [main]
    paths:
      - '.github/registro-poesia/**'
      - '.github/workflows/registro-poesia.yml'
      - 'Poesia/test/**'
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5 msoffcrypto-tool==5.4.2
      - run: python .github/registro-poesia/verifica.py
      - run: node --check Poesia/test/test.js && node --check Poesia/test/registro.js
